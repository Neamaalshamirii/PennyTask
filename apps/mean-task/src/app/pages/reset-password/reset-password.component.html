<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header" style="text-align:center;">
      <span class="auth-badge">Reset Password</span>
      <h1>Set New Password</h1>
      <p>Enter your new password below.</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">

      <!-- New Password -->
      <div class="field">
        <label>New Password</label>
        <div class="field-input">
          <input
            type="password"
            placeholder="•••••••"
            [(ngModel)]="password"
            name="password"
          />
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label>Confirm Password</label>
        <div class="field-input">
          <input
            type="password"
            placeholder="•••••••"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
          />
        </div>
      </div>

      <!-- Submit -->
      <button class="primary-btn full" type="submit">
        Reset Password
      </button>

      <!-- Success & Error -->
      <p *ngIf="message" class="success-text">{{ message }}</p>
      <p *ngIf="error" class="error-text">{{ error }}</p>

    </form>

    <div class="auth-footer">
      <a routerLink="/login" class="link subtle">Back to Login</a>
    </div>

  </div>
</div>
