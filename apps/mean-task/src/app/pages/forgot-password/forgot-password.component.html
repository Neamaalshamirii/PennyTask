<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header" style="text-align: center;">
      <span class="auth-badge">Password Reset</span>
      <h1>Forgot Password</h1>
      <p>Enter your email and we'll send you a reset link.</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">

      <div class="field">
        <label>Email</label>
        <div class="field-input">
          <input
            type="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
      </div>

      <button class="primary-btn full" type="submit">
        Send Reset Link
      </button>

      <p *ngIf="message" class="success-text">{{ message }}</p>
      <p *ngIf="error" class="error-text">{{ error }}</p>

    </form>

    <div class="auth-footer">
      <a class="link subtle" routerLink="/login">Back to Login</a>
    </div>

  </div>
</div>
